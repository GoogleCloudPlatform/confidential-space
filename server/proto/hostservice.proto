syntax = "proto3";

package hostservice;

import "attestation.proto";

option go_package = "github.com/GoogleCloudPlatform/confidential-space/server/proto/gen/hostservice";
option java_multiple_files = true;
option java_outer_classname = "Hostservice";

service HostService {
  // Performs a simple self-test.
  rpc SelfTest(SelfTestRequest) returns (SelfTestResponse) {}

  // Obtains an attestation from the TPM.
  rpc GetHostAttestation(GetHostAttestationRequest)
      returns (GetHostAttestationResponse) {}

  // RecordWorkloadEvent extends a single container workload claim into the
  // host dTPM (PCR 19) and appends it to the host Canonical Event Log (CEL).
  //
  // This operation is not idempotent: retrying this request (e.g., in cases
  // where status != OK) may result in duplicate records in the CEL.
  rpc RecordWorkloadEvent(RecordWorkloadEventRequest)
      returns (RecordWorkloadEventResponse);
}

message GetHostAttestationRequest {
  bytes challenge = 1;
}

message GetHostAttestationResponse {
  confidential_space.HostAttestation host_attestation = 1;
}

message RecordWorkloadEventRequest {
  // Binary-encoded cel.CosTlv record (Type 80 TLV).
  bytes cos_event = 1;
}

message RecordWorkloadEventResponse {}

message SelfTestRequest {}

message SelfTestResponse {
  string response = 1;
}
