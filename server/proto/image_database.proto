syntax = "proto3";

package image_database;

import "google/protobuf/timestamp.proto";
import "proto/state.proto";  // github.com/google/go-eventlog, for state.HashAlgo
import "proto/attest.proto";

option go_package = "github.com/GoogleCloudPlatform/confidential-space/server/proto/gen/image_database";

message ImageDatabase {
  enum AttributeLabel {
    NIL = 0;
    TEST = 1;  // test images
    USABLE = 2;
    STABLE = 3;
    LATEST = 4;
    EXPERIMENTAL = 5;  // external images that contain experimental features
  }

  // Represents values associated with a Confidential Space Image
  message ImageGoldenEntry {
    // The public facing image release name.
    string image_release_name = 1;
    bool is_hardened = 2;
    uint32 image_base_version = 5;
    uint32 swversion = 6;
    repeated AttributeLabel attribute_labels = 9;
    // Explicitly marks the CS Image as retired. If this field is true,
    // attestation validations for the corresponding CS image should fail.
    bool deprecated = 7;

    // Golden values of measurement registers of this image release. At most one
    // entry per (register_type, register_index, hash_algo). If a register has
    // no entry, no golden values are published for it.
    repeated RegisterDigests register_digests = 10;

    reserved 3, 4;
    reserved "grub_digests", "efi_digests";
  }

  // Type of a measurement register.
  enum RegisterType {
    REGISTER_TYPE_UNSPECIFIED = 0;
    REGISTER_TYPE_PCR = 1;   // TPM Platform Configuration Register
    REGISTER_TYPE_RTMR = 2;  // Intel TDX Runtime Measurement Register
  }

  // Golden values of one measurement register in one hash bank.
  message RegisterDigests {
    RegisterType register_type = 1;

    // The PCR index (e.g. 8 for PCR8) or the RTMR index as reported in the TD
    // quote (e.g. 2 for RTMR[2]). For RTMRs, this is not the CC MR index used
    // in the CC event log, which is the RTMR index + 1.
    uint32 register_index = 2;

    // Hash algorithm of the register bank. RTMRs always use SHA384.
    state.HashAlgo hash_algo = 3;

    // Lowercase hex encodings (no "0x" prefix) of the values of this register
    // after known-good boots of this image release. A register value matches
    // if it equals any of them. The order and the number of values are not
    // significant and may change.
    repeated string digests = 4;
  }

  enum CCKnownCertificates {
    UNSPECIFIED_CERT = 0;
    CONF_SPACE_SELF_SIGNED_DB_CA = 1;
    COS_DB_V10 = 2;
    COS_DB_V20250203 = 3;
    COS_DB_V20251004 = 4;
    COS_DB_V20260706 = 5;
  }

  message CCDatabase {
    repeated CCKnownCertificates known_certificates = 1 [packed = false];
    repeated string known_cert_fingerprints = 3 [packed = false];

    repeated string digests = 2;
  }

  message ImageBaseEntry {
    CCDatabase db = 1;
    CCDatabase dbx = 2;
    CCDatabase authority = 3;
  }

  // This encodes minimum requirements for general attestations received by the
  // verifier.
  message ServiceBasePolicy {
    google.protobuf.Timestamp earliest_cert_issue_time = 1;
    reserved 2;
    reserved "firmware_policy";
  }

  message ConfidentialSpaceBasePolicy {
    attest.Policy firmware_policy = 1;
  }

  // Map of kernel command line to other image golden values.
  map<string, ImageGoldenEntry> golden_values = 1;

  // Map of image base version to image base values.
  map<uint32, ImageBaseEntry> image_base_values = 2;

  // Attestation Verifier appraisal policy for verifying all attestations.
  // The service will validate this policy before use case specific
  // attestations, like Confidential Space.
  ServiceBasePolicy service_base_policy = 5;

  // Attestation Verifier appraisal policy for verifying Confidential Space
  // attestations.
  ConfidentialSpaceBasePolicy cs_base_policy = 6;

  // Map of known certificates to their DER encoded form.
  map<string, bytes> known_certs = 7;

  reserved 3, 4;
  reserved "firmware_policy", "earliest_cert_issue_time";
}
